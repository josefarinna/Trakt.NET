version: 2
updates:
  - package-ecosystem: nuget
    directory: "/src"
    schedule:
      interval: daily
      time: "22:00"
    open-pull-requests-limit: 20
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "22:00"
    open-pull-requests-limit: 20
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

